services:
  mysql:
    image: mysql:8.0
    container_name: coffee-pos-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - coffee-pos-network

  redis:
    image: redis:7-alpine
    container_name: coffee-pos-redis-prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: "redis-cli -a $$REDIS_PASSWORD ping"
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - coffee-pos-network

  app:
    build: .
    container_name: coffee-pos-app-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - coffee-pos-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  coffee-pos-network:
    driver: bridge
